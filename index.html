<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour De Maui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --green:   #00ff00;
            --magenta: #ff00ff;
            --cyan:    #00ffff;
            --yellow:  #ffff00;
            --bg:      #000;
        }

        body {
            font-family: 'VT323', monospace;
            background: var(--bg);
            color: var(--green);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: default;
        }

        /* ── SCANLINE OVERLAY ───────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.18) 0px,
                rgba(0,0,0,0.18) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── VIGNETTE ───────────────────────────────────────── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 9998;
        }

        /* ── MAIN CARD ──────────────────────────────────────── */
        .card {
            position: relative;
            width: min(520px, 92vw);
            background: #0a0a0a;
            border: 4px solid transparent;
            border-radius: 4px;
            padding: 48px 44px 44px;
            text-align: center;

            background:
                linear-gradient(#0a0a0a, #0a0a0a) padding-box,
                linear-gradient(135deg,
                    var(--green)   0%,
                    var(--cyan)    30%,
                    var(--magenta) 60%,
                    var(--yellow)  100%
                ) border-box;

            box-shadow:
                0 0 40px rgba(0,255,0,0.15),
                inset 0 0 60px rgba(0,255,0,0.04);

            animation: cardIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* corner brackets */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--yellow);
            border-style: solid;
        }
        .card::before { top: 6px; left: 6px;  border-width: 2px 0 0 2px; }
        .card::after  { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

        /* ── TITLE ──────────────────────────────────────────── */
        .title {
            font-size: 3.8rem;
            color: var(--magenta);
            letter-spacing: 6px;
            text-shadow:
                3px 3px 0 var(--cyan),
                -2px -2px 0 var(--yellow),
                0 0 24px var(--magenta);
            line-height: 1;
            margin-bottom: 6px;
            animation: glitch 4s infinite;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--cyan);
            letter-spacing: 4px;
            text-shadow: 0 0 8px var(--cyan);
            margin-bottom: 44px;
        }

        @keyframes glitch {
            0%,88%,100% { transform: translate(0); filter: none; }
            89% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
            90% { transform: translate(2px, -1px); }
            91% { transform: translate(0, 1px);    filter: none; }
            92% { transform: translate(-1px, 0); }
            93% { transform: translate(0); }
        }

        /* ── MODE LABEL ─────────────────────────────────────── */
        .mode-label {
            font-size: 1rem;
            letter-spacing: 3px;
            color: #444;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* ── TOGGLE ROW ─────────────────────────────────────── */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 44px;
            user-select: none;
        }

        .mode-name {
            font-size: 2rem;
            letter-spacing: 3px;
            transition: color 0.25s, text-shadow 0.25s;
            cursor: pointer;
            min-width: 90px;
        }

        .mode-name.full {
            text-align: right;
            color: var(--green);
            text-shadow: 0 0 12px var(--green);
        }

        .mode-name.classic {
            text-align: left;
            color: #333;
            text-shadow: none;
        }

        /* toggled state */
        .toggle-row.classic-mode .mode-name.full {
            color: #333;
            text-shadow: none;
        }
        .toggle-row.classic-mode .mode-name.classic {
            color: var(--magenta);
            text-shadow: 0 0 12px var(--magenta);
        }

        /* The physical toggle */
        .toggle-switch {
            position: relative;
            width: 64px;
            height: 30px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0; height: 0;
            position: absolute;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: #111;
            border: 2px solid var(--green);
            border-radius: 0;
            box-shadow: 0 0 8px rgba(0,255,0,0.4);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
        }

        input:checked + .toggle-track {
            border-color: var(--magenta);
            box-shadow: 0 0 8px rgba(255,0,255,0.4);
        }
        input:checked + .toggle-track .toggle-thumb {
            transform: translateX(34px);
            background: var(--magenta);
            box-shadow: 0 0 8px var(--magenta);
        }

        /* ── LAUNCH BUTTON ──────────────────────────────────── */
        .launch-btn {
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: #000;
            background: var(--green);
            border: none;
            padding: 12px 40px;
            cursor: pointer;
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: background 0.25s, box-shadow 0.25s, transform 0.1s;
            box-shadow: 0 0 20px rgba(0,255,0,0.4), 4px 4px 0 rgba(0,255,0,0.2);
        }

        .launch-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.4s;
        }

        .launch-btn:hover::before { left: 100%; }
        .launch-btn:hover {
            box-shadow: 0 0 30px rgba(0,255,0,0.7), 4px 4px 0 rgba(0,255,0,0.3);
        }
        .launch-btn:active { transform: scale(0.97); }

        .launch-btn.classic-active {
            background: var(--magenta);
            box-shadow: 0 0 20px rgba(255,0,255,0.4), 4px 4px 0 rgba(255,0,255,0.2);
        }
        .launch-btn.classic-active:hover {
            box-shadow: 0 0 30px rgba(255,0,255,0.7), 4px 4px 0 rgba(255,0,255,0.3);
        }

        /* ── FOOTER STATUS BAR ──────────────────────────────── */
        .status-bar {
            margin-top: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #2a2a2a;
            border-top: 1px solid #1a1a1a;
            padding-top: 14px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            margin-right: 6px;
            animation: blink 1.4s step-start infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        /* ── BOOT LINES (decorative) ────────────────────────── */
        .boot-lines {
            position: absolute;
            top: 8px;
            left: 0; right: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0 14px;
            pointer-events: none;
        }

        .boot-line {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #1c1c1c;
            text-align: left;
            animation: bootReveal 0.4s both;
        }
        .boot-line:nth-child(1) { animation-delay: 0.0s; }
        .boot-line:nth-child(2) { animation-delay: 0.08s; }
        .boot-line:nth-child(3) { animation-delay: 0.16s; }

        @keyframes bootReveal {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="card">
    <!-- decorative boot text -->
    <div class="boot-lines" aria-hidden="true">
        <div class="boot-line">BIOS v2.4.1 … OK</div>
        <div class="boot-line">CHECKING MEDIA … FOUND</div>
        <div class="boot-line">LOADING EXPERIENCE…</div>
    </div>

    <div class="title">"TOUR DE MAUI"</div>
    <div class="subtitle">// SKATE SPOT SHOWCASE //</div>

    <div class="mode-label">[ SELECT MODE ]</div>

    <div class="toggle-row" id="toggleRow">
        <span class="mode-name full" id="labelFull" onclick="setMode(false)">FULL</span>

        <label class="toggle-switch" title="Switch mode">
            <input type="checkbox" id="modeToggle">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>

        <span class="mode-name classic" id="labelClassic" onclick="setMode(true)">CLASSIC</span>
    </div>

    <button class="launch-btn" id="launchBtn" onclick="launch()">
        [ LAUNCH FULL ]
    </button>

    <div class="status-bar">
        <span><span class="status-dot"></span>READY</span>
        <span id="modeIndicator">MODE: FULL</span>
        <span>TDM v1.0</span>
    </div>
</div>

<script>
    const toggle       = document.getElementById('modeToggle');
    const toggleRow    = document.getElementById('toggleRow');
    const launchBtn    = document.getElementById('launchBtn');
    const modeIndicator = document.getElementById('modeIndicator');

    // ── File paths ────────────────────────────────────────────────────────────
    // Update these to match your actual file names / paths
    const PATHS = {
        full:    'full.html',
        classic: 'classic.html',
    };

    let isClassic = false;

    function setMode(classic) {
        isClassic = classic;
        toggle.checked = classic;
        updateUI();
    }

    function updateUI() {
        if (isClassic) {
            toggleRow.classList.add('classic-mode');
            launchBtn.textContent = '[ LAUNCH CLASSIC ]';
            launchBtn.classList.add('classic-active');
            modeIndicator.textContent = 'MODE: CLASSIC';
        } else {
            toggleRow.classList.remove('classic-mode');
            launchBtn.textContent = '[ LAUNCH FULL ]';
            launchBtn.classList.remove('classic-active');
            modeIndicator.textContent = 'MODE: FULL';
        }
    }

    function launch() {
        // Brief flash effect before navigating
        launchBtn.style.opacity = '0.5';
        setTimeout(() => {
            window.location.href = isClassic ? PATHS.classic : PATHS.full;
        }, 120);
    }

    toggle.addEventListener('change', () => {
        isClassic = toggle.checked;
        updateUI();
    });

    // Keyboard shortcut: Enter to launch, F = Full, C = Classic
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter')   launch();
        if (e.key === 'f' || e.key === 'F') setMode(false);
        if (e.key === 'c' || e.key === 'C') setMode(true);
    });
</script>
</body>
</html>
