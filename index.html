<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour De Maui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #00ff00;
      --magenta: #ff00ff;
      --cyan: #00ffff;
      --yellow: #ffff00;
      --bg: #000000;
      --panel: #0a0a0a;
      --line: #1a1a1a;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'VT323', monospace;
      background: var(--bg);
      color: var(--green);
      min-height: 100vh;
      overflow: hidden;
      cursor: default;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.74) 100%);
      pointer-events: none;
      z-index: 9998;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(60%, 1.35fr) minmax(280px, 0.65fr);
      align-items: stretch;
    }

    .left-side {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(14px, 2vw, 28px);
      min-width: 0;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: min(100%, clamp(620px, 74vw, 1100px));
      background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(135deg, var(--green) 0%, var(--cyan) 28%, var(--magenta) 62%, var(--yellow) 100%) border-box;
      border: 4px solid transparent;
      border-radius: 6px;
      padding: clamp(18px, 2vw, 30px);
      box-shadow:
        0 0 40px rgba(0,255,0,0.15),
        inset 0 0 60px rgba(0,255,0,0.04);
      animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      overflow: hidden;
    }

    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--yellow);
      border-style: solid;
      pointer-events: none;
    }

    .card::before { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .card::after { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    .boot-lines {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 16px;
      pointer-events: none;
    }

    .boot-line {
      font-size: 0.68rem;
      letter-spacing: 2px;
      color: #1c1c1c;
      text-align: left;
      animation: bootReveal 0.4s both;
    }

    .boot-line:nth-child(1) { animation-delay: 0.0s; }
    .boot-line:nth-child(2) { animation-delay: 0.08s; }
    .boot-line:nth-child(3) { animation-delay: 0.16s; }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-top: clamp(18px, 2vw, 28px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .title {
      font-size: clamp(2.8rem, 6vw, 5.3rem);
      color: var(--magenta);
      letter-spacing: clamp(4px, 0.7vw, 7px);
      text-shadow: 3px 3px 0 var(--cyan), -2px -2px 0 var(--yellow), 0 0 24px var(--magenta);
      line-height: 0.95;
      margin-bottom: 8px;
      animation: glitch 4s infinite;
    }

    .subtitle {
      font-size: clamp(1rem, 1.5vw, 1.35rem);
      color: var(--cyan);
      letter-spacing: clamp(3px, 0.4vw, 5px);
      text-shadow: 0 0 8px var(--cyan);
    }

    .hero-status {
      min-width: 160px;
      text-align: right;
      font-size: clamp(0.95rem, 1.3vw, 1.15rem);
      letter-spacing: 3px;
      color: #7aff7a;
      padding-top: 8px;
      opacity: 0.9;
    }

    .hero-status .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      margin-right: 8px;
      animation: blink 1.4s step-start infinite;
      vertical-align: middle;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, rgba(15,15,15,0.96), rgba(10,10,10,0.96));
      border: 1px solid #1d1d1d;
      box-shadow: inset 0 0 30px rgba(0,255,0,0.03);
      padding: clamp(16px, 1.8vw, 22px);
      min-height: 100%;
    }

    .panel::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(0,255,255,0.08);
      pointer-events: none;
    }

    .mode-label {
      font-size: clamp(0.9rem, 1.1vw, 1rem);
      letter-spacing: 3px;
      color: #4a4a4a;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .toggle-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      user-select: none;
    }

    .mode-name {
      font-size: clamp(1.6rem, 2.8vw, 2.4rem);
      letter-spacing: 3px;
      transition: color 0.25s, text-shadow 0.25s, transform 0.25s;
      cursor: pointer;
      min-width: 90px;
      opacity: 0.8;
    }

    .mode-name.full {
      text-align: right;
      color: var(--green);
      text-shadow: 0 0 12px var(--green);
    }

    .mode-name.classic {
      text-align: left;
      color: #333;
      text-shadow: none;
    }

    .toggle-row.classic-mode .mode-name.full {
      color: #333;
      text-shadow: none;
    }

    .toggle-row.classic-mode .mode-name.classic {
      color: var(--magenta);
      text-shadow: 0 0 12px var(--magenta);
      opacity: 1;
    }

    .toggle-switch {
      position: relative;
      width: 72px;
      height: 34px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #111;
      border: 2px solid var(--green);
      border-radius: 0;
      box-shadow: 0 0 8px rgba(0,255,0,0.4);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .toggle-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
    }

    .toggle-switch input:checked + .toggle-track {
      border-color: var(--magenta);
      box-shadow: 0 0 8px rgba(255,0,255,0.4);
    }

    .toggle-switch input:checked + .toggle-track .toggle-thumb {
      transform: translateX(38px);
      background: var(--magenta);
      box-shadow: 0 0 8px var(--magenta);
    }

    .info-grid {
      display: grid;
      gap: 12px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      border-left: 2px solid rgba(0,255,255,0.22);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .info-label {
      font-size: clamp(0.82rem, 1vw, 0.95rem);
      letter-spacing: 3px;
      color: #666;
    }

    .info-value {
      font-size: clamp(1.05rem, 1.4vw, 1.25rem);
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0,255,255,0.45);
    }

    .action-panel {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .launch-btn {
      font-family: 'VT323', monospace;
      font-size: clamp(1.6rem, 2.2vw, 2rem);
      letter-spacing: 4px;
      color: #000;
      background: var(--green);
      border: none;
      padding: 14px 24px;
      cursor: pointer;
      width: 100%;
      position: relative;
      overflow: hidden;
      transition: background 0.25s, box-shadow 0.25s, transform 0.1s;
      box-shadow: 0 0 20px rgba(0,255,0,0.4), 4px 4px 0 rgba(0,255,0,0.2);
    }

    .launch-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.4s;
    }

    .launch-btn:hover::before { left: 100%; }

    .launch-btn:hover {
      box-shadow: 0 0 30px rgba(0,255,0,0.7), 4px 4px 0 rgba(0,255,0,0.3);
    }

    .launch-btn:active { transform: scale(0.98); }

    .launch-btn.classic-active {
      background: var(--magenta);
      box-shadow: 0 0 20px rgba(255,0,255,0.4), 4px 4px 0 rgba(255,0,255,0.2);
    }

    .launch-btn.classic-active:hover {
      box-shadow: 0 0 30px rgba(255,0,255,0.7), 4px 4px 0 rgba(255,0,255,0.3);
    }

    .helper-text {
      font-size: clamp(0.82rem, 1vw, 0.95rem);
      letter-spacing: 2px;
      color: #555;
      text-align: center;
      text-transform: uppercase;
    }

    .status-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: clamp(0.78rem, 0.95vw, 0.88rem);
      letter-spacing: 2px;
      color: #2a2a2a;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      flex-wrap: wrap;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      margin-right: 6px;
      animation: blink 1.4s step-start infinite;
      vertical-align: middle;
    }

    .cover-side {
      min-width: 0;
      height: 100%;
      padding: clamp(12px, 1.5vw, 20px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skate-btn {
      position: relative;
      width: min(100%, clamp(220px, 30vw, 420px));
      aspect-ratio: 240 / 336;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      color: #fce303;
      text-decoration: none;
      font-family: 'VT323', monospace;
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      letter-spacing: 3px;
      background-image: url('SkateImageVaultCover.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 4px solid #000;
      box-shadow:
        inset 0 0 55px rgba(0,0,0,0.2),
        0 0 18px rgba(255, 122, 0, 0.8);
      transform-origin: center;
      overflow: hidden;
      animation: coverFloat 5.5s ease-in-out infinite, coverGlow 3.5s ease-in-out infinite;
      margin-left: auto;
      margin-right: auto;
      align-self: center;
    }

    .skate-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.28) 50%, rgba(255,255,255,0.12) 55%, transparent 100%);
      transform: translateX(-140%);
      transition: transform 0.8s ease;
      pointer-events: none;
    }

    .skate-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(255,255,255,0.18), transparent 35%);
      mix-blend-mode: screen;
      opacity: 0.55;
      pointer-events: none;
      animation: coverPulse 4s ease-in-out infinite;
    }

    .skate-btn span {
      position: relative;
      z-index: 1;
      text-shadow: 1px 1px 0 #fff, 0 0 8px rgba(0,0,0,0.75);
    }

    .skate-btn:hover {
      transform: scale(1.05) rotate(-1deg);
      filter: brightness(1.12) saturate(1.15);
      box-shadow: 0 0 0 3px #00ffff, 10px 10px 0 #000, 0 0 28px rgba(255, 122, 0, 1);
    }

    .skate-btn:hover::before {
      transform: translateX(140%);
    }

    .skate-btn:active {
      transform: scale(0.98);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.92) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes glitch {
      0%, 88%, 100% { transform: translate(0); filter: none; }
      89% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
      90% { transform: translate(2px, -1px); }
      91% { transform: translate(0, 1px); }
      92% { transform: translate(-1px, 0); }
      93% { transform: translate(0); }
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes bootReveal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes coverFloat {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(0deg); }
    }
    @keyframes coverGlow {
      0%, 100% { box-shadow: inset 0 0 55px rgba(0,0,0,0.2), 0 0 18px rgba(255, 122, 0, 0.75); }
      50% { box-shadow: inset 0 0 65px rgba(0,0,0,0.14), 0 0 24px rgba(255, 122, 0, 1); }
    }
    @keyframes coverPulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.02); }
    }

    @media (max-width: 1100px) {
      .page {
        grid-template-columns: 1.15fr 0.85fr;
      }

      .card {
        width: min(100%, 1000px);
      }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .page {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }

      .left-side {
        padding-bottom: 0;
      }

      .cover-side {
        padding-top: 0;
        padding-bottom: 18px;
      }

      .skate-btn {
        width: min(100%, 520px);
        aspect-ratio: 240 / 336;
        animation: none;
      }
    }

    @media (max-width: 560px) {
      .left-side {
        padding: 12px;
      }

      .card {
        padding: 18px 14px 14px;
      }

      .hero {
        flex-direction: column;
        align-items: stretch;
      }

      .hero-status {
        text-align: left;
        min-width: 0;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .toggle-row {
        gap: 10px;
      }

      .mode-name {
        font-size: 1.5rem;
        min-width: 68px;
      }

      .info-item {
        padding: 10px 12px;
      }

      .launch-btn {
        font-size: 1.6rem;
      }

      .status-bar {
        justify-content: center;
      }

      .cover-side {
        padding: 12px;
      }

      .skate-btn {
        width: min(100%, 360px);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="left-side">
      <div class="card">
        <div class="boot-lines" aria-hidden="true">
          <div class="boot-line">BIOS v2.4.1 OK</div>
          <div class="boot-line">CHECKING MEDIA... FOUND</div>
          <div class="boot-line">LOADING EXPERIENCE...</div>
        </div>

        <header class="hero">
          <div>
            <div class="title">TOUR DE MAUI</div>
            <div class="subtitle">SKATE SPOT SHOWCASE</div>
          </div>
          <div class="hero-status">
            <span class="status-dot"></span>
            <span id="modeIndicatorTop">MODE: FULL</span>
          </div>
        </header>

        <main class="main-grid">
          <section class="panel">
            <div class="mode-label">SELECT MODE</div>
            <div class="toggle-row" id="toggleRow">
              <span class="mode-name full" id="labelFull" onclick="setMode(false)">FULL</span>
              <label class="toggle-switch" title="Switch mode">
                <input type="checkbox" id="modeToggle">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
              </label>
              <span class="mode-name classic" id="labelClassic" onclick="setMode(true)">CLASSIC</span>
            </div>
          </section>

          <aside class="panel">
            <div class="mode-label">SYSTEM STATUS</div>
            <div class="info-grid">
              <div class="info-item"><span class="info-label">ROUTE</span><span class="info-value">SAN VAN</span></div>
              <div class="info-item"><span class="info-label">SIGNAL</span><span class="info-value">STABLE</span></div>
              <div class="info-item"><span class="info-label">BUILD</span><span class="info-value">v1.0</span></div>
            </div>
          </aside>
        </main>

        <section class="action-panel">
          <button class="launch-btn" id="launchBtn" onclick="launch()">LAUNCH FULL</button>
          <div class="helper-text">Press F for Full, C for Classic, Enter to launch.</div>
        </section>

        <div class="status-bar">
          <span><span class="status-dot"></span>READY</span>
          <span id="modeIndicatorBottom">MODE: FULL</span>
          <span>TDM v1.0</span>
        </div>
      </div>
    </div>

    <div class="cover-side">
      <a href="SkateImageVault.html" class="skate-btn">
        <span>SKATE. Photo Album</span>
      </a>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('modeToggle');
    const toggleRow = document.getElementById('toggleRow');
    const launchBtn = document.getElementById('launchBtn');
    const modeIndicatorTop = document.getElementById('modeIndicatorTop');
    const modeIndicatorBottom = document.getElementById('modeIndicatorBottom');

    const PATHS = {
      full: 'full.html',
      classic: 'classic.html'
    };

    let isClassic = false;

    function setMode(classic) {
      isClassic = classic;
      toggle.checked = classic;
      updateUI();
    }

    function updateUI() {
      if (isClassic) {
        toggleRow.classList.add('classic-mode');
        launchBtn.textContent = 'LAUNCH CLASSIC';
        launchBtn.classList.add('classic-active');
        modeIndicatorTop.textContent = 'MODE: CLASSIC';
        modeIndicatorBottom.textContent = 'MODE: CLASSIC';
      } else {
        toggleRow.classList.remove('classic-mode');
        launchBtn.textContent = 'LAUNCH FULL';
        launchBtn.classList.remove('classic-active');
        modeIndicatorTop.textContent = 'MODE: FULL';
        modeIndicatorBottom.textContent = 'MODE: FULL';
      }
    }

    function launch() {
      launchBtn.style.opacity = '0.5';
      setTimeout(() => window.location.href = isClassic ? PATHS.classic : PATHS.full, 120);
    }

    toggle.addEventListener('change', () => {
      isClassic = toggle.checked;
      updateUI();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') launch();
      if (e.key === 'f' || e.key === 'F') setMode(false);
      if (e.key === 'c' || e.key === 'C') setMode(true);
    });

    updateUI();
  </script>
</body>
</html>
