<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour De Maui</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'VT323', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0;
        }
        
/* CRT Container */
.crt-container {
    position: relative;
    width: 100%;
    max-width: 95%;
    height: 95%;
    background: #0a0a0a;
    border: 5px solid transparent;
    border-radius: 20px 20px 0px 0px;
    box-shadow: 
        inset 0 0 50px rgba(0, 255, 0, 0.2),
        0 0 30px rgba(0, 255, 0, 0.3);
    overflow: hidden;
    
    /* CRT-style green gradient border */
    background: 
        linear-gradient(#0a0a0a, #0a0a0a) padding-box,
        linear-gradient(180deg, 
            #00ff00 0%, 
            #ff00ff 25%, 
            #00ffff 50%, 
			#00ffff 75%,
            #ffff00 100%
        ) border-box;
    border-color: transparent;
    
    /* scanline effect */
    &::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
            0deg,
            rgba(0, 255, 0, 0.03) 0px,
            rgba(0, 0, 0, 0.1) 2px,
            transparent 3px
        );
        pointer-events: none;
        z-index: 1;
    }
}

/* Add flicker animation */
@keyframes crt-flicker {
    0% { opacity: 1; }
    50% { opacity: 0.95; }
    100% { opacity: 1; }
}

.crt-container {
    animation: crt-flicker 0.50s infinite;
}
        
        /* CRT Screen Effect */
        .crt-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }
        
        /* Scanlines */
        .crt-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanline 8s linear infinite;
        }
        
        /* Screen curve effect */
        .crt-screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.4) 100%);
            pointer-events: none;
            z-index: 999;
        }
        
        /* VHS noise overlay */
        .vhs-noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.03) 2px,
                    rgba(255, 255, 255, 0.03) 4px
                );
            opacity: 0.3;
            pointer-events: none;
            z-index: 998;
            animation: vhsNoise 0.3s infinite;
        }
        
        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }
        
        @keyframes vhsNoise {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.4; }
        }
        
        /* Main content area */
        .content {
            position: relative;
            z-index: 10;
            padding: 12px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: glitch 3s infinite;
        }
        
        .header h1 {
            font-size: 4rem;
            color: #ff00ff;
            text-shadow: 
                3px 3px 0 #00ffff,
                -2px -2px 0 #ffff00,
                0 0 20px #ff00ff;
            letter-spacing: 8px;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
            transition: all 0.3s;
            cursor: pointer;
            padding-bottom: 5px;
        }
        
        .header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00);
            transition: width 0.3s;
        }
        
        .header h1:hover::after {
            width: 100%;
        }
        
        .header h1:hover {
            text-shadow: 
                3px 3px 0 #00ffff,
                -2px -2px 0 #ffff00,
                0 0 30px #ff00ff,
                0 0 40px #ff00ff;
        }
        
        /* Tooltip-style popup */
        .title-popup {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(255, 0, 255, 0.95);
            border: 3px solid #ffff00;
            padding: 12px 25px;
            font-size: 1.3rem;
            color: #000;
            text-shadow: none;
            letter-spacing: 2px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            z-index: 1001;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.7);
        }
        
        .title-popup::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #ffff00;
        }
        
        /* VHS Glitch Animation on hover */
        .header h1:hover .title-popup {
            animation: vhsGlitchIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        
        @keyframes vhsGlitchIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0) rotateZ(-5deg);
                filter: hue-rotate(0deg) saturate(2);
            }
            15% {
                opacity: 0.3;
                transform: translateX(-48%) scale(0.3) rotateZ(2deg);
                filter: hue-rotate(90deg) saturate(3);
            }
            25% {
                opacity: 0.7;
                transform: translateX(-52%) scale(0.5) rotateZ(-3deg);
                box-shadow: 
                    -5px 0 0 #ff00ff,
                    5px 0 0 #00ffff,
                    0 0 40px rgba(255, 255, 0, 1);
            }
            35% {
                transform: translateX(-50%) scale(0.8) rotateZ(1deg);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.15) rotateZ(-1deg);
                filter: hue-rotate(180deg) saturate(2);
                box-shadow: 
                    -8px 0 0 #ff00ff,
                    8px 0 0 #00ffff,
                    0 0 60px rgba(255, 255, 0, 1);
            }
            65% {
                transform: translateX(-50%) scale(0.95) rotateZ(0.5deg);
            }
            80% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05) rotateZ(-0.5deg);
                filter: hue-rotate(0deg) saturate(1);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1) rotateZ(0deg);
                filter: hue-rotate(0deg) saturate(1);
                box-shadow: 0 0 25px rgba(255, 255, 0, 0.7);
            }
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #00ff00;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff00;
        }
        
        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            91% {
                transform: translate(-2px, 2px);
            }
            92% {
                transform: translate(2px, -2px);
            }
            93% {
                transform: translate(-2px, 2px);
            }
            94% {
                transform: translate(0);
            }
        }
        
        /* Main layout */
        .main-layout {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }
        
        /* Spot Menu */
        .spot-menu {
            flex: 0 0 350px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #00ff00;
            padding: 0;
            overflow: hidden;
            max-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .spot-menu-sticky {
            flex-shrink: 0;
            padding: 10px 10px 0 10px;
        }

        .spot-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 10px 10px;
        }

        .spot-list-scroll::-webkit-scrollbar { width: 12px; }
        .spot-list-scroll::-webkit-scrollbar-track { background: #000; border: 1px solid #00ff00; }
        .spot-list-scroll::-webkit-scrollbar-thumb { background: #00ff00; border: 2px solid #000; }
        .spot-list-scroll::-webkit-scrollbar-thumb:hover { background: #ffff00; }
        
        .spot-menu-title-legacy { display: none; }
        
        .spot-item {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #ff02ff;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.3rem;
            color: #00efef;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .spot-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 0, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .spot-item:hover::before {
            left: 100%;
        }
        
        .spot-item:hover {
            background: rgba(0, 255, 0, 0.3);
            border-color: #ffff00;
            color: #ffff00;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        
        .spot-item.active  {
            background: rgba(225, 225, 0, 0.21);
            border-color: #ffff02;
            color: #e0e000;
            box-shadow: 0 0 20px rgba(219, 219, 3, 0.86);
        }
        
        /* Video Container */
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #00ffff;
            padding: 10px;
            overflow: hidden;
        }
        
        .video-title {
            font-size: 2rem;
            color: #ff00ff;
            text-align: center;
            margin-bottom: 6px;
            padding: 10px;
            background: #1a001a;
            border: 2px solid #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }
        
        .video-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            border: 2px solid #ffff00;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .placeholder {
            font-size: 2.5rem;
            color: #02ff02;
            text-align: center;
            text-shadow: 0 0 20px #03c403;
        }
        
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }
        
        /* Static canvas for video transitions */
        .static-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
        }

        .static-overlay.active {
            opacity: 1;
        }

        #staticCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        
        /* ── COMBINED CONTROLS BAR (static + loop + tracking) ─────────── */
        .static-toggle-bar {
            display: flex;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 0;
            margin-bottom: 6px;
            padding: 0;
            background: rgba(0,0,0,0.6);
            border: 2px solid #333;
            user-select: none;
            overflow: hidden;
        }

        .static-toggle-bar:hover { border-color: #444; }

        /* Each labelled group inside the bar */
        .ctrl-section {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            flex-shrink: 0;
        }

        /* Tracking section stretches to fill leftover space */
        .ctrl-section.tracking-section {
            flex: 1;
            min-width: 150px;
        }

        /* Vertical divider — full bar height via align-items: stretch */
        .ctrl-divider {
            width: 1px;
            background: #2a2a2a;
            flex-shrink: 0;
            align-self: stretch;
        }

        /* Labels */
        .static-toggle-label,
        .loop-toggle-label,
        .tracking-label {
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .static-toggle-label { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
        .loop-toggle-label   { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }
        .tracking-label      { color: #00ffff; text-shadow: 0 0 5px #00ffff; }

        .toggle-icon { font-size: 0.85rem; }

        /* Toggle switch — smaller than before */
        .toggle-switch-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toggle-switch-wrap input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            display: inline-block;
            width: 32px;
            height: 16px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 0;
            position: relative;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .toggle-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 8px;
            height: 8px;
            background: #444;
            transition: transform 0.2s, background 0.2s;
        }

        input[type="checkbox"]:checked + .toggle-track {
            background: rgba(0,255,0,0.15);
            border-color: #00ff00;
            box-shadow: 0 0 6px rgba(0,255,0,0.4);
        }

        input[type="checkbox"]:checked + .toggle-track .toggle-thumb {
            transform: translateX(16px);
            background: #00ff00;
            box-shadow: 0 0 4px #00ff00;
        }

        input[type="checkbox"]#loopToggle:checked + .toggle-track {
            background: rgba(255,0,255,0.15);
            border-color: #ff00ff;
            box-shadow: 0 0 6px rgba(255,0,255,0.4);
        }

        input[type="checkbox"]#loopToggle:checked + .toggle-track .toggle-thumb {
            transform: translateX(16px);
            background: #ff00ff;
            box-shadow: 0 0 4px #ff00ff;
        }

        .toggle-status,
        #loopStatus {
            font-size: 0.85rem;
            letter-spacing: 1px;
            min-width: 22px;
            flex-shrink: 0;
        }

        .toggle-status     { color: #00ff00; text-shadow: 0 0 4px #00ff00; }
        .toggle-status.off { color: #444;    text-shadow: none; }
        #loopStatus        { color: #ff00ff; text-shadow: 0 0 4px #ff00ff; }
        #loopStatus.off    { color: #444;    text-shadow: none; }

        /* Tracking slider — fills available space, never overflows */
        #trackingSlider {
            flex: 1;
            min-width: 0;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            background: #111;
            border: 1px solid #333;
            outline: none;
            cursor: pointer;
        }

        #trackingSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            background: #ff00ff;
            border: 2px solid #ffff00;
            cursor: pointer;
            box-shadow: 0 0 5px #ff00ff;
        }

        #trackingSlider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            background: #ff00ff;
            border: 2px solid #ffff00;
            cursor: pointer;
            box-shadow: 0 0 5px #ff00ff;
        }

        #trackingReset {
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
            color: #ffff00;
            border: 1px solid #ffff00;
            background: transparent;
            padding: 1px 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1.4;
        }

        #trackingReset:hover {
            background: rgba(255,255,0,0.15);
            box-shadow: 0 0 6px #ffff00;
        }

        /* Responsive: tracking section wraps to its own row below 640px */
        @media screen and (max-width: 640px) {
            .ctrl-section { padding: 4px 8px; gap: 5px; }
            .ctrl-section.tracking-section {
                flex-basis: 100%;
                border-top: 1px solid #222;
            }
            .ctrl-divider { display: none; }
        }

        /* Ticker footer (outside CRT) */
        .ticker-footer {
            width: 100%;
            max-width: 95%;
            background: #000;
            border: 5px solid #ff00ff;
            padding: 7px 0;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }

        /* Flash on click */
        .ticker-footer.ticker-flash {
            border-color: #ffff00;
            box-shadow: 0 0 18px rgba(255,255,0,0.6);
        }

        .ticker-content {
            display: inline-block;
            font-size: 1.2rem;
            color: #00ffff;
            letter-spacing: 3px;
            text-shadow: 0 0 8px #00ffff;
            white-space: nowrap;
            will-change: transform;
        }

        @keyframes tickerScroll {
            from { transform: translateX(calc(90vw + 40px)); }
            to   { transform: translateX(-100%); }
        }

        /* Channel display OSD */
        .channel-display {
            position: absolute;
            top: 12px;
            right: 14px;
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: #fff;
            text-shadow:
                0 0 6px #fff,
                0 0 14px rgba(255,255,255,0.6);
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
            filter: blur(0.4px);
        }

        .channel-display.visible {
            opacity: 1;
        }

        /* EASTER easter egg overlay */
        .EASTER-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .EASTER-overlay.active {
            display: flex;
            animation: EASTERFlash 0.3s;
        }

        @keyframes EASTERFlash {
            0%,100% { background: rgba(0,0,0,0.92); }
            50% { background: rgba(255,0,255,0.3); }
        }

        .EASTER-text {
            font-size: 3rem;
            animation: rainbowText 1s linear infinite, glitch 0.5s infinite;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .EASTER-subtext {
            font-size: 1.8rem;
            color: #00ffff;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 30px;
            animation: blink 1s infinite;
        }

        .EASTER-close {
            font-size: 1.3rem;
            color: #ffff00;
            border: 2px solid #ffff00;
            padding: 10px 30px;
            cursor: pointer;
            letter-spacing: 2px;
            background: transparent;
            font-family: 'VT323', monospace;
            transition: all 0.2s;
        }

        .EASTER-close:hover {
            background: rgba(255,255,0,0.2);
            box-shadow: 0 0 20px #ffff00;
        }

        /* Easter egg video screen */
        .easter-video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 3000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .easter-video-overlay.active {
            display: flex;
        }

        #easterVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .easter-close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            color: #ffff00;
            border: 2px solid #ffff00;
            background: rgba(0,0,0,0.7);
            padding: 6px 18px;
            cursor: pointer;
            letter-spacing: 2px;
            z-index: 3001;
            transition: all 0.2s;
            text-shadow: 0 0 8px #ffff00;
        }

        .easter-close-btn:hover {
            background: rgba(255,255,0,0.2);
            box-shadow: 0 0 20px #ffff00;
        }

        /* Social links panel overlaid on easter video */
        .easter-links {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            z-index: 3001;
            padding: 0 20px;
        }

        .easter-link-btn {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #000;
            background: #00ffff;
            border: 3px solid #fff;
            padding: 8px 20px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
            box-shadow: 0 0 12px rgba(0,255,255,0.5), 3px 3px 0 rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .easter-link-btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.07) translateY(-2px);
            box-shadow: 0 0 25px rgba(0,255,255,0.9), 3px 3px 0 rgba(0,0,0,0.8);
        }

        .easter-link-btn:active {
            transform: scale(0.97) translateY(0);
        }

        .easter-link-icon {
            font-size: 1.3rem;
            line-height: 1;
        }

        @keyframes rainbowText {
            0%   { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
            16%  { color: #ff8800; text-shadow: 0 0 20px #ff8800; }
            33%  { color: #ffff00; text-shadow: 0 0 20px #ffff00; }
            50%  { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
            66%  { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
            83%  { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        }

        /* Screen shake */
        @keyframes screenShake {
            0%,100% { transform: translate(0,0); }
            10% { transform: translate(-5px, 4px); }

            height: 28px;

        .reel {
            width: 26px;
            height: 26px;
            border: 3px solid #00ffff;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel::before {
            content: '';
            width: 8px;
            height: 8px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            background: #000;
        }

        .reel-left  { animation: none; }
        .reel-right { animation: none; }

        .reel.spinning {
            animation: reelSpin 1.2s linear infinite;
        }

        .reel-right.spinning {
            animation: reelSpin 1.2s linear infinite reverse;
        }

        @keyframes reelSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .vhs-tape-track {
            flex: 1;
            height: 14px;
            background: #0a0a0a;
            border: 2px solid #333;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .vhs-tape-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff00, #00ffff);
            box-shadow: 0 0 6px #00ff00;
            transition: width 0.25s linear;
            position: relative;
        }

        /* Sprocket holes on the track */
        .vhs-tape-track::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 18px,
                rgba(0,0,0,0.5) 18px,
                rgba(0,0,0,0.5) 20px
            );
            pointer-events: none;
            z-index: 2;

        .crt-volume-hud {

            bottom: 14px;

            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.2s ease;

        .crt-volume-hud.visible {
            opacity: 1;
        }

        .crt-vol-label {
            font-family: 'VT323', monospace;
            font-size: 1.15rem;
            color: #00ff00;
            letter-spacing: 3px;

        .crt-vol-bar {

            box-shadow: 0 0 6px #00ff00;
            transition: height 0.1s ease, background 0.1s, box-shadow 0.1s;
            border-radius: 1px 1px 0 0;
        }

        /* muted state — all bars dimmed */
        .crt-volume-hud.muted .crt-vol-bar {
            background: #333;
            box-shadow: none;
        }

        .crt-vol-bar.peak {
            background: #ff4400;
            box-shadow: 0 0 8px #ff4400;
        }

        /* ── MUTE BUTTON ACCENT ──────────────────────────────────────── */
        #muteBtn {
            color: #ffff00;

            background: rgba(255,255,0,0.07);

            ],

            // ── TICKER PHRASES ─────────────────────────────────────────────
            // Each entry can be a plain string, OR an object with:
            //   text:  the phrase to display
            //   color: main text color  (any CSS color, e.g. "#ff00ff" or "red")
            //   glow:  glow/shadow color (defaults to same as color if omitted)
            // Plain strings fall back to the default cyan color.
            tickerPhrases: [
                { text: "🛹  SMASH [R] TO SEND IT TO A RANDOM SPOT — NO BAILING ALLOWED", color: "#00ff00", glow: "#00ff00" },
                { text: "🕹️ Enter ↑↑↓↓←→←→BA  —  THERE'S A SECRET IN HERE.",          color: "#00ffff", glow: "#00ffff" },
                { text: "🚫❌NO TIMMYS ALLOWED❌🚫",                                     color: "#c00000", glow: "#c00000" },
                { text: "😤‍BLINKER BREAK️💨",                                              color: "#ffff00", glow: "#ffff00" },
                { text: "🎫CLICK THE -TOUR DE MAUI- TITLE ABOVE TO JOIN THE TOUR🎫",      color: "#ff00ff", glow: "#ff00ff" },
            ],

            // ── EASTER EGG LINKS ───────────────────────────────────────────
            // Shown as buttons overlaid on the easter egg video.
            // Add as many as you want. Each needs: label, url, and icon (emoji or text).
            easterLinks: [
                { icon: "📺", label: "TWITCH",   url: "https://www.twitch.tv/MauiKrouse" },
                { icon: "▶️",  label: "YOUTUBE",  url: "https://www.youtube.com/@MauiKrouseTV/videos" },
                { icon: "💬", label: "DISCORD",  url: "https://discord.gg/9aeJB9XZ9D" },
                { icon: "👕", label: "MERCH",    url: "https://mauikrouse.com/" },
                { icon: "🌲", label: "LINKTREE", url: "https://linktr.ee/mauikrouse" },
            ]
        };
        
        // ═══════════════════════════════════════════════════════════════════
        // END OF CONFIG
        // ═══════════════════════════════════════════════════════════════════
        
        const videoPlayer = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('placeholder');
        const videoTitle = document.getElementById('videoTitle');
        const staticOverlay = document.getElementById('staticOverlay');
        const staticCanvas = document.getElementById('staticCanvas');
        const spotList = document.getElementById('spotList');
        const mainTitle = document.getElementById('mainTitle');
        const EASTEROverlay = document.getElementById('EASTEROverlay');
        const EASTERClose = document.getElementById('EASTERClose');
        const easterVideoOverlay = document.getElementById('easterVideoOverlay');
        const easterVideo = document.getElementById('easterVideo');
        const easterCloseBtn = document.getElementById('easterCloseBtn');
        const easterLinksEl = document.getElementById('easterLinks');
        const crtContainer = document.querySelector('.crt-container');
        const tickerEl = document.getElementById('tickerContent');
        const channelDisplay = document.getElementById('channelDisplay');
        const staticToggle = document.getElementById('staticToggle');
        const toggleStatus = document.getElementById('toggleStatus');
        const staticToggleBar = document.getElementById('staticToggleBar');

        let currentSpotIndex = -1;
        let staticRafId = null;

        // ── STATIC TOGGLE + LOCALSTORAGE ─────────────────────────────────────
        function applyToggleState(on) {
            staticToggle.checked = on;
            if (on) {
                toggleStatus.textContent = 'ON';
                toggleStatus.classList.remove('off');
            } else {
                toggleStatus.textContent = 'OFF';
                toggleStatus.classList.add('off');
            }
            try { localStorage.setItem('staticEnabled', on ? '1' : '0'); } catch(e) {}
        }

        // Load saved state (default ON)
        (function() {
            let saved = '1';
            try { saved = localStorage.getItem('staticEnabled') ?? '1'; } catch(e) {}
            applyToggleState(saved === '1');
        })();

        // Only the toggle switch itself toggles — not the whole bar
        document.getElementById('toggleSwitchWrap').addEventListener('click', function(e) {
            e.stopPropagation();
            applyToggleState(!staticToggle.checked);
        });

        // ── STATIC AUDIO ─────────────────────────────────────────────────────
        const staticAudio = new Audio('static.mp3');
        staticAudio.volume = 0.6;

        // ── CANVAS STATIC ────────────────────────────────────────────────────
        const ctx = staticCanvas.getContext('2d');

        function resizeCanvas() {
            const wrapper = staticCanvas.parentElement.parentElement;
            staticCanvas.width  = wrapper.clientWidth  || 640;
            staticCanvas.height = wrapper.clientHeight || 360;
        }

        function drawStatic(intensity) {
            resizeCanvas();
            const w = staticCanvas.width, h = staticCanvas.height;
            const imgData = ctx.createImageData(w, h);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                const v = Math.random() < intensity ? (Math.random() * 255 | 0) : 0;
                d[i]   = v;
                d[i+1] = v;
                d[i+2] = v;
                d[i+3] = Math.random() < intensity ? 220 : 0;
            }
            ctx.putImageData(imgData, 0, 0);

            // Occasional bright horizontal "sync" bands
            if (Math.random() < 0.25) {
                const y = Math.random() * h | 0;
                const bh = (Math.random() * 8 + 2) | 0;
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.4})`;
                ctx.fillRect(0, y, w, bh);
            }
        }

        function runStatic(duration, onDone) {
            cancelAnimationFrame(staticRafId);
            const start = performance.now();
            staticOverlay.classList.add('active');

            // Play audio if file is present
            staticAudio.currentTime = 0;
            staticAudio.play().catch(() => {}); // silently fail if file missing

            function frame(now) {
                const t = (now - start) / duration; // 0 → 1
                if (t >= 1) {
                    staticOverlay.classList.remove('active');
                    staticAudio.pause();
                    staticAudio.currentTime = 0;
                    onDone && onDone();
                    return;
                }
                const intensity = 0.85 * (1 - t * t);
                drawStatic(intensity);
                staticRafId = requestAnimationFrame(frame);
            }
            staticRafId = requestAnimationFrame(frame);
        }

        // ── CHANNEL DISPLAY ──────────────────────────────────────────────────
        let channelTimeout = null;
        function showChannel() {
            const ch = Math.floor(Math.random() * 99) + 1;
            channelDisplay.textContent = `CH ${String(ch).padStart(2, '0')}`;
            channelDisplay.classList.add('visible');
            clearTimeout(channelTimeout);
            channelTimeout = setTimeout(() => {
                channelDisplay.classList.remove('visible');
            }, 2200);
        }

        // ── TICKER ───────────────────────────────────────────────────────────
        (function runTicker() {
            const tickerFooter = tickerEl.parentElement;
            const DEFAULT_COLOR = '#00ffff';
            const DEFAULT_GLOW  = '#00ffff';

            // Normalise every entry to { text, color, glow }
            const phrases = CONFIG.tickerPhrases.map(p =>
                typeof p === 'string'
                    ? { text: p, color: DEFAULT_COLOR, glow: DEFAULT_GLOW }
                    : { text: p.text, color: p.color || DEFAULT_COLOR, glow: p.glow || p.color || DEFAULT_GLOW }
            );

            let idx = 0;
            let skipping = false;

            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }
            shuffle(phrases);

            function applyPhrase(entry) {
                tickerEl.textContent = entry.text;
                tickerEl.style.color      = entry.color;
                tickerEl.style.textShadow = `0 0 8px ${entry.glow}, 0 0 16px ${entry.glow}44`;
            }

            function scrollPhrase() {
                skipping = false;
                const entry = phrases[idx % phrases.length];
                idx++;
                if (idx > 0 && idx % phrases.length === 0) shuffle(phrases);

                applyPhrase(entry);
                tickerEl.style.animation = 'none';
                tickerEl.offsetWidth; // reflow
                const pxPerSec = 90;
                const totalPx = window.innerWidth + tickerEl.scrollWidth + 80;
                const dur = totalPx / pxPerSec;
                tickerEl.style.animation = `tickerScroll ${dur}s linear`;
            }

            tickerEl.addEventListener('animationend', scrollPhrase);
            scrollPhrase();

            // Click ticker bar → jump to a new random phrase immediately
            tickerFooter.addEventListener('click', () => {
                if (skipping) return;
                skipping = true;

                // Pick a random phrase that isn't the current one
                let newIdx;
                do { newIdx = Math.floor(Math.random() * phrases.length); }
                while (phrases.length > 1 && newIdx === (idx - 1 + phrases.length) % phrases.length);
                idx = newIdx;

                // Brief border flash
                tickerFooter.classList.add('ticker-flash');
                setTimeout(() => tickerFooter.classList.remove('ticker-flash'), 300);

                // Restart with new phrase
                tickerEl.removeEventListener('animationend', scrollPhrase);
                scrollPhrase();
                tickerEl.addEventListener('animationend', scrollPhrase);
            });
        })();

        // ── LOAD SPOT ────────────────────────────────────────────────────────
        function loadSpot(index) {
            if (index < 0 || index >= CONFIG.spots.length) return;
            currentSpotIndex = index;

            const spot = CONFIG.spots[index];
            const items = document.querySelectorAll('.spot-item');
            items.forEach((i, idx) => {
                i.classList.toggle('active', idx === index);
            });
            items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            showChannel();

            if (staticToggle.checked) {
                runStatic(550, () => {
                    videoPlayer.src = spot.video;
                    videoPlayer.style.display = 'block';
                    placeholder.style.display = 'none';
                    videoTitle.textContent = spot.name;
                    videoPlayer.play().catch(() => {});
                });
            } else {
                videoPlayer.src = spot.video;
                videoPlayer.style.display = 'block';
                placeholder.style.display = 'none';
                videoTitle.textContent = spot.name;
                videoPlayer.play().catch(() => {});
            }
        }

        // ── EASTER CODE ─────────────────────────────────────────────────────
        const EASTERSequence = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let EASTERIndex = 0;

        EASTERClose.addEventListener('click', () => {
            EASTEROverlay.classList.remove('active');
            // Build social links from config (once)
            if (easterLinksEl.children.length === 0) {
                CONFIG.easterLinks.forEach(link => {
                    const a = document.createElement('a');
                    a.className = 'easter-link-btn';
                    a.href = link.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.innerHTML = `<span class="easter-link-icon">${link.icon}</span>${link.label}`;
                    easterLinksEl.appendChild(a);
                });
            }
            // Launch the easter egg video
            easterVideo.src = 'Clips/_EASTER.mp4';
            easterVideoOverlay.classList.add('active');
            easterVideo.play().catch(() => {});
        });

        easterCloseBtn.addEventListener('click', () => {
            easterVideoOverlay.classList.remove('active');
            easterVideo.pause();
            easterVideo.src = '';
        });

        // ── INITIALIZE ───────────────────────────────────────────────────────
        function initializeApp() {
            const titleText = document.querySelector('.header h1').childNodes[0];
            titleText.textContent = `"${CONFIG.title}"`;
            document.querySelector('.subtitle').textContent = CONFIG.subtitle;

            if (CONFIG.twitchUrl) {
                mainTitle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.open(CONFIG.twitchUrl, '_blank');
                });
            }

            CONFIG.spots.forEach((spot, index) => {
                const spotItem = document.createElement('div');
                spotItem.className = 'spot-item';
                spotItem.setAttribute('data-video', spot.video);
                spotItem.setAttribute('data-description', spot.description || '');
                spotItem.textContent = spot.name;
                spotList.appendChild(spotItem);
                spotItem.addEventListener('click', function() {
                    loadSpot(index);
                });
            });
        }

        function pickRandom() {
            const r = Math.floor(Math.random() * CONFIG.spots.length);
            loadSpot(r);
            crtContainer.classList.remove('shake');
            void crtContainer.offsetWidth;
            crtContainer.classList.add('shake');
            setTimeout(() => crtContainer.classList.remove('shake'), 600);
        }

        // ── KEYBOARD CONTROLS ────────────────────────────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key === EASTERSequence[EASTERIndex]) {
                EASTERIndex++;
                if (EASTERIndex === EASTERSequence.length) {
                    EASTERIndex = 0;
                    crtContainer.classList.remove('shake');
                    void crtContainer.offsetWidth;
                    crtContainer.classList.add('shake');
                    setTimeout(() => {
                        EASTEROverlay.classList.add('active');
                        crtContainer.classList.remove('shake');
                    }, 500);
                }
            } else {
                EASTERIndex = 0;
            }
            if (e.key === 'r' || e.key === 'R') pickRandom();
        });

        // ── SPOT COUNT ───────────────────────────────────────────────────
        function updateSpotCount() {
            const total = CONFIG.spots.length;
            document.getElementById('spotMenuHeader').textContent = `[ SELECT A SPOT ] [ 1-${total} ]`;
        }

        // ── TIMECODE OVERLAY ─────────────────────────────────────────────
        const timecodeOverlay   = document.getElementById('timecodeOverlay');
        const timecodeCurrentEl = document.getElementById('timecodeCurrentTime');
        const timecodeDurEl     = document.getElementById('timecodeDuration');

        function fmtTime(s) {
            if (isNaN(s)) return '00:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }

        // ── CUSTOM VHS CONTROLS ──────────────────────────────────────────
        const playPauseBtn = document.getElementById('playPauseBtn');
        const rewBtn       = document.getElementById('rewBtn');
        const ffBtn        = document.getElementById('ffBtn');
        const vhsTapeTrack = document.getElementById('vhsTapeTrack');
        const vhsTapeFill  = document.getElementById('vhsTapeFill');
        const reelLeft     = document.getElementById('reelLeft');
        const reelRight    = document.getElementById('reelRight');

        videoPlayer.addEventListener('loadedmetadata', () => {
            timecodeDurEl.textContent = fmtTime(videoPlayer.duration);
            timecodeOverlay.classList.add('visible');
        });

        videoPlayer.addEventListener('timeupdate', () => {
            timecodeCurrentEl.textContent = fmtTime(videoPlayer.currentTime);
            // Update tape fill
            const pct = videoPlayer.duration ? (videoPlayer.currentTime / videoPlayer.duration) * 100 : 0;
            vhsTapeFill.style.width = pct + '%';
            // Reel spin speed based on progress
            const speed = Math.max(0.3, 2.5 - (pct / 100) * 2);
            reelLeft.style.animationDuration  = speed + 's';
            reelRight.style.animationDuration = speed + 's';
        });

        videoPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '❙❙ PAUSE';
            reelLeft.classList.add('spinning');
            reelRight.classList.add('spinning');
        });

        videoPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '► PLAY';
            reelLeft.classList.remove('spinning');
            reelRight.classList.remove('spinning');
        });

        videoPlayer.addEventListener('ended', () => {
            if (videoPlayer.dataset.loopEnabled === '1') {
                videoPlayer.currentTime = 0;
                videoPlayer.play().catch(() => {});
            } else {
                playPauseBtn.textContent = '► PLAY';
                reelLeft.classList.remove('spinning');
                reelRight.classList.remove('spinning');
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (!videoPlayer.src || videoPlayer.style.display === 'none') return;
            videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
        });

        rewBtn.addEventListener('click', () => {
            if (!videoPlayer.src || videoPlayer.style.display === 'none') return;
            videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 3);
        });

        ffBtn.addEventListener('click', () => {
            if (!videoPlayer.src || videoPlayer.style.display === 'none') return;
            videoPlayer.currentTime = Math.min(videoPlayer.duration || 0, videoPlayer.currentTime + 3);
        });

        // Click-to-seek on tape track
        vhsTapeTrack.addEventListener('click', (e) => {
            if (!videoPlayer.duration) return;
            const rect = vhsTapeTrack.getBoundingClientRect();
            const pct  = (e.clientX - rect.left) / rect.width;
            videoPlayer.currentTime = pct * videoPlayer.duration;
        });

        // ── CRT VOLUME HUD ───────────────────────────────────────────────
        const crtVolumeHud = document.getElementById('crtVolumeHud');
        const crtVolBars   = document.getElementById('crtVolBars');
        const crtVolLabel  = document.getElementById('crtVolLabel');
        const muteBtn      = document.getElementById('muteBtn');
        const volDownBtn   = document.getElementById('volDownBtn');
        const volUpBtn     = document.getElementById('volUpBtn');
        const videoWrapper = document.querySelector('.video-wrapper');

        const VOL_STEPS = 20;   // number of bar segments
        const VOL_PEAK  = 16;   // bars at/above this index turn red
        let volHudTimeout = null;

        // Build bar segments
        for (let i = 0; i < VOL_STEPS; i++) {
            const bar = document.createElement('div');
            bar.className = 'crt-vol-bar';
            // Height scales from short (left) to tall (right)
            const h = 4 + Math.round((i / (VOL_STEPS - 1)) * 24);
            bar.style.height = h + 'px';
            crtVolBars.appendChild(bar);
        }

        function updateVolHud() {
            const vol = videoPlayer.volume;   // 0–1
            const muted = videoPlayer.muted;
            const filled = muted ? 0 : Math.round(vol * VOL_STEPS);
            const bars = crtVolBars.querySelectorAll('.crt-vol-bar');
            bars.forEach((bar, i) => {
                const active = i < filled;
                bar.style.background = active
                    ? (i >= VOL_PEAK ? '#ff4400' : '#00ff00')
                    : '#1a1a1a';
                bar.style.boxShadow = active
                    ? (i >= VOL_PEAK ? '0 0 8px #ff4400' : '0 0 6px #00ff00')
                    : 'none';
            });
            crtVolLabel.textContent = muted ? '🔇 MUTE' : `VOL ${filled}`;
            crtVolumeHud.classList.toggle('muted', muted);
        }

        function showVolHud() {
            updateVolHud();
            crtVolumeHud.classList.add('visible');
            clearTimeout(volHudTimeout);
            volHudTimeout = setTimeout(() => crtVolumeHud.classList.remove('visible'), 2000);
        }

        // Volume +/-
        volUpBtn.addEventListener('click', () => {
            videoPlayer.volume = Math.min(1, Math.round((videoPlayer.volume + 0.05) * 100) / 100);
            if (videoPlayer.muted) { videoPlayer.muted = false; muteBtn.textContent = '🔊  MUTE '; }
            showVolHud();
        });

        volDownBtn.addEventListener('click', () => {
            videoPlayer.volume = Math.max(0, Math.round((videoPlayer.volume - 0.05) * 100) / 100);
            showVolHud();
        });

        // Mute / Unmute
        muteBtn.addEventListener('click', () => {
            videoPlayer.muted = !videoPlayer.muted;
            muteBtn.textContent = videoPlayer.muted ? '🔇 UNMUTE' : '🔊  MUTE ';
            showVolHud();
        });

        // Init mute button state & volume
        videoPlayer.volume = 1;
        videoPlayer.muted  = false;
        updateVolHud();

        // ── FULLSCREEN — double-click video wrapper ───────────────────────
        videoWrapper.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                const fn = videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen || videoWrapper.mozRequestFullScreen;
                if (fn) fn.call(videoWrapper);
            } else {
                const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
                if (fn) fn.call(document);
            }
        });

        // ── LOOP TOGGLE ───────────────────────────────────────────────────
        const loopSwitchWrap = document.getElementById('loopSwitchWrap');
        const loopToggle     = document.getElementById('loopToggle');
        const loopStatus     = document.getElementById('loopStatus');

        function applyLoopState(on) {
            loopToggle.checked = on;
            videoPlayer.dataset.loopEnabled = on ? '1' : '0';
            loopStatus.textContent = on ? 'ON' : 'OFF';
            loopStatus.classList.toggle('off', !on);
            try { localStorage.setItem('loopEnabled', on ? '1' : '0'); } catch(e) {}
        }

        // Load saved loop state (default ON)
        (function() {
            let saved = '1';
            try { saved = localStorage.getItem('loopEnabled') ?? '1'; } catch(e) {}
            applyLoopState(saved === '1');
        })();

        loopSwitchWrap.addEventListener('click', (e) => {
            e.stopPropagation();
            applyLoopState(!loopToggle.checked);
        });

        // ── TRACKING DISTORTION ──────────────────────────────────────────
        const trackingSlider = document.getElementById('trackingSlider');
        const trackingReset  = document.getElementById('trackingReset');

        function applyTracking(val) {
            const v = val / 100;
            const blur      = (v * v * 4).toFixed(2);        // 0–4px
            const hueRot    = Math.round(v * 180);            // 0–180deg
            const saturate  = (1 + v * 3).toFixed(2);        // 1–4
            const skewY     = (v * 6).toFixed(2);            // 0–6deg
            const contrast  = (1 + v * 1.5).toFixed(2);      // 1–2.5
            videoPlayer.style.filter    = `blur(${blur}px) hue-rotate(${hueRot}deg) saturate(${saturate}) contrast(${contrast})`;
            videoPlayer.style.transform = `skewY(-${skewY}deg)`;
        }

        trackingSlider.addEventListener('input', () => applyTracking(trackingSlider.value));

        trackingReset.addEventListener('click', () => {
            trackingSlider.value = 0;
            videoPlayer.style.filter    = '';
            videoPlayer.style.transform = '';
        });

        // ── INIT ──────────────────────────────────────────────────────────
        initializeApp();
        updateSpotCount();

        // Handle video errors
        videoPlayer.addEventListener('error', function() {
            placeholder.style.display = 'block';
            videoPlayer.style.display = 'none';
            staticOverlay.classList.remove('active');
            timecodeOverlay.classList.remove('visible');
            reelLeft.classList.remove('spinning');
            reelRight.classList.remove('spinning');
            vhsTapeFill.style.width = '0%';
            // Put error label inside smpte label
            const lbl = placeholder.querySelector('.smpte-label');
            if (lbl) lbl.innerHTML = '⚠ VIDEO FILE NOT FOUND ⚠<br><span style="font-size:1rem">[ CHECK FILE PATH ]</span>';
        });
    </script>
