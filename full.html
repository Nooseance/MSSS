<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour De Maui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'VT323', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0;
        }
        
/* CRT Container */
.crt-container {
    position: relative;
    width: 100%;
    max-width: 95%;
    height: 95%;
    background: #0a0a0a;
    border: 5px solid transparent;
    border-radius: 20px 20px 0px 0px;
    box-shadow: 
        inset 0 0 50px rgba(0, 255, 0, 0.2),
        0 0 30px rgba(0, 255, 0, 0.3);
    overflow: hidden;
    
    /* CRT-style green gradient border */
    background: 
        linear-gradient(#0a0a0a, #0a0a0a) padding-box,
        linear-gradient(180deg, 
            #00ff00 0%, 
            #ff00ff 25%, 
            #00ffff 50%, 
			#00ffff 75%,
            #ffff00 100%
        ) border-box;
    border-color: transparent;
    
    /* scanline effect */
    &::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
            0deg,
            rgba(0, 255, 0, 0.03) 0px,
            rgba(0, 0, 0, 0.1) 2px,
            transparent 3px
        );
        pointer-events: none;
        z-index: 1;
    }
}

/* crt-flicker removed for performance */
        
        /* CRT Screen Effect */
        .crt-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }
        
        /* Scanlines */
        .crt-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }
        
        /* screen vignette removed for performance */
        
        /* VHS noise overlay */
        .vhs-noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.03) 2px,
                    rgba(255, 255, 255, 0.03) 4px
                );
            opacity: 0.3;
            pointer-events: none;
            z-index: 998;
        }
        


        /* Main content area */
        .content {
            position: relative;
            z-index: 10;
            padding: 12px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Back button */
        .back-btn {
            position: absolute;
            top: 10px;
            left: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            color: #00ffff;
            border: 2px solid #00ffff;
            background: transparent;
            padding: 3px 10px;
            cursor: pointer;
            letter-spacing: 2px;
            z-index: 100;
            transition: all 0.2s;
            text-shadow: 0 0 6px #00ffff;
            box-shadow: 0 0 6px rgba(0,255,255,0.2);
            text-decoration: none;
            display: inline-block;
            line-height: 1.4;
        }
        .back-btn:hover {
            background: rgba(0,255,255,0.12);
            box-shadow: 0 0 14px rgba(0,255,255,0.5);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: glitch 3s infinite;
        }
        
        .header h1 {
            font-size: 4rem;
            color: #ff00ff;
            text-shadow: 
                3px 3px 0 #00ffff,
                -2px -2px 0 #ffff00,
                0 0 20px #ff00ff;
            letter-spacing: 8px;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
            transition: all 0.3s;
            cursor: pointer;
            padding-bottom: 5px;
        }
        
        .header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00);
            transition: width 0.3s;
        }
        
        .header h1:hover::after {
            width: 100%;
        }
        
        .header h1:hover {
            text-shadow: 
                3px 3px 0 #00ffff,
                -2px -2px 0 #ffff00,
                0 0 30px #ff00ff,
                0 0 40px #ff00ff;
        }
        
        /* Tooltip-style popup */
        .title-popup {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(255, 0, 255, 0.95);
            border: 3px solid #ffff00;
            padding: 12px 25px;
            font-size: 1.3rem;
            color: #000;
            text-shadow: none;
            letter-spacing: 2px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            z-index: 1001;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.7);
        }
        
        .title-popup::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #ffff00;
        }
        
        /* VHS Glitch Animation on hover */
        .header h1:hover .title-popup {
            animation: vhsGlitchIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        
        @keyframes vhsGlitchIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0) rotateZ(-5deg);
                filter: hue-rotate(0deg) saturate(2);
            }
            15% {
                opacity: 0.3;
                transform: translateX(-48%) scale(0.3) rotateZ(2deg);
                filter: hue-rotate(90deg) saturate(3);
            }
            25% {
                opacity: 0.7;
                transform: translateX(-52%) scale(0.5) rotateZ(-3deg);
                box-shadow: 
                    -5px 0 0 #ff00ff,
                    5px 0 0 #00ffff,
                    0 0 40px rgba(255, 255, 0, 1);
            }
            35% {
                transform: translateX(-50%) scale(0.8) rotateZ(1deg);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.15) rotateZ(-1deg);
                filter: hue-rotate(180deg) saturate(2);
                box-shadow: 
                    -8px 0 0 #ff00ff,
                    8px 0 0 #00ffff,
                    0 0 60px rgba(255, 255, 0, 1);
            }
            65% {
                transform: translateX(-50%) scale(0.95) rotateZ(0.5deg);
            }
            80% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05) rotateZ(-0.5deg);
                filter: hue-rotate(0deg) saturate(1);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1) rotateZ(0deg);
                filter: hue-rotate(0deg) saturate(1);
                box-shadow: 0 0 25px rgba(255, 255, 0, 0.7);
            }
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #00ff00;
            letter-spacing: 3px;
            text-shadow: 0 0 6px #00ff00;
        }
        
        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            91% {
                transform: translate(-2px, 2px);
            }
            92% {
                transform: translate(2px, -2px);
            }
            93% {
                transform: translate(-2px, 2px);
            }
            94% {
                transform: translate(0);
            }
        }
        
        /* Main layout */
        .main-layout {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }
        
        /* Spot Menu */
        .spot-menu {
            flex: 0 0 350px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #00ff00;
            padding: 0;
            overflow: hidden;
            max-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .spot-menu-sticky {
            flex-shrink: 0;
            padding: 10px 10px 0 10px;
        }

        .spot-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 10px 10px;
        }

        .spot-list-scroll::-webkit-scrollbar { width: 12px; }
        .spot-list-scroll::-webkit-scrollbar-track { background: #000; border: 1px solid #00ff00; }
        .spot-list-scroll::-webkit-scrollbar-thumb { background: #00ff00; border: 2px solid #000; }
        .spot-list-scroll::-webkit-scrollbar-thumb:hover { background: #ffff00; }
        
        .spot-menu-title-legacy { display: none; }
        
        .spot-item {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #ff02ff;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.3rem;
            color: #00efef;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .spot-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 0, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .spot-item:hover::before {
            left: 100%;
        }
        
        .spot-item:hover {
            background: rgba(0, 255, 0, 0.3);
            border-color: #ffff00;
            color: #ffff00;
            transform: scale(1.05);
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
        }
        
        .spot-item.active  {
            background: rgba(225, 225, 0, 0.21);
            border-color: #ffff02;
            color: #e0e000;
            box-shadow: 0 0 10px rgba(219, 219, 3, 0.5);
        }
        
        /* Video Container */
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #00ffff;
            padding: 10px;
            overflow: hidden;
        }
        
        .video-title {
            font-size: 2rem;
            color: #ff00ff;
            text-align: center;
            margin-bottom: 6px;
            padding: 10px;
            background: #1a001a;
            border: 2px solid #ff00ff;
            text-shadow: 0 0 8px #ff00ff;
        }
        
        .video-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            border: 2px solid #ffff00;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            contain: layout paint;
        }
        
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .placeholder {
            font-size: 2.5rem;
            color: #02ff02;
            text-align: center;
            text-shadow: 0 0 20px #03c403;
        }
        
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }
        
        /* Static canvas for video transitions */
        .static-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
        }

        .static-overlay.active {
            opacity: 1;
        }

        #staticCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        
        /* ── COMBINED CONTROLS BAR (static + loop + tracking) ─────────── */
        .static-toggle-bar {
            display: flex;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 0;
            margin-bottom: 6px;
            padding: 0;
            background: rgba(0,0,0,0.6);
            border: 2px solid #333;
            user-select: none;
            overflow: hidden;
        }

        .static-toggle-bar:hover { border-color: #444; }

        /* Each labelled group inside the bar */
        .ctrl-section {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            flex-shrink: 0;
        }

        /* Tracking section stretches to fill leftover space */
        .ctrl-section.tracking-section {
            flex: 1;
            min-width: 150px;
        }

        /* Vertical divider — full bar height via align-items: stretch */
        .ctrl-divider {
            width: 1px;
            background: #2a2a2a;
            flex-shrink: 0;
            align-self: stretch;
        }

        /* Labels */
        .static-toggle-label,
        .loop-toggle-label,
        .tracking-label {
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .static-toggle-label { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
        .tracking-label      { color: #00ffff; text-shadow: 0 0 5px #00ffff; }

        .toggle-icon { font-size: 0.85rem; }

        /* Toggle switch — smaller than before */
        .toggle-switch-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toggle-switch-wrap input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            display: inline-block;
            width: 32px;
            height: 16px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 0;
            position: relative;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .toggle-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 8px;
            height: 8px;
            background: #444;
            transition: transform 0.2s, background 0.2s;
        }

        input[type="checkbox"]:checked + .toggle-track {
            background: rgba(0,255,0,0.15);
            border-color: #00ff00;
            box-shadow: 0 0 6px rgba(0,255,0,0.4);
        }

        input[type="checkbox"]:checked + .toggle-track .toggle-thumb {
            transform: translateX(16px);
            background: #00ff00;
            box-shadow: 0 0 4px #00ff00;
        }

        .toggle-status {
            font-size: 0.85rem;
            letter-spacing: 1px;
            min-width: 22px;
            flex-shrink: 0;
        }

        .toggle-status     { color: #00ff00; text-shadow: 0 0 4px #00ff00; }
        .toggle-status.off { color: #444;    text-shadow: none; }

        /* Responsive: tracking section wraps to its own row below 640px */
        @media screen and (max-width: 640px) {
            .ctrl-section { padding: 4px 8px; gap: 5px; }
            .ctrl-divider { display: none; }
        }

        /* Ticker footer (outside CRT) */
        .ticker-footer {
            width: 100%;
            max-width: 95%;
            background: #000;
            border: 5px solid #ff00ff;
            padding: 7px 0;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }

        /* Flash on click */
        .ticker-footer.ticker-flash {
            border-color: #ffff00;
            box-shadow: 0 0 18px rgba(255,255,0,0.6);
        }

        .ticker-content {
            display: inline-block;
            font-size: 1.2rem;
            color: #00ffff;
            letter-spacing: 3px;
            text-shadow: 0 0 5px #00ffff;
            white-space: nowrap;
            will-change: transform;
            transform: translateZ(0);
        }

        @keyframes tickerScroll {
            from { transform: translateX(calc(90vw + 40px)); }
            to   { transform: translateX(-100%); }
        }

        /* Channel display OSD */
        .channel-display {
            position: absolute;
            top: 12px;
            right: 14px;
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 6px #fff;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;

        }

        .channel-display.visible {
            opacity: 1;
        }

        /* EASTER easter egg overlay */
        .EASTER-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .EASTER-overlay.active {
            display: flex;
            animation: EASTERFlash 0.3s;
        }

        @keyframes EASTERFlash {
            0%,100% { background: rgba(0,0,0,0.92); }
            50% { background: rgba(255,0,255,0.3); }
        }

        .EASTER-text {
            font-size: 3rem;
            animation: rainbowText 1s linear infinite, glitch 0.5s infinite;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .EASTER-subtext {
            font-size: 1.8rem;
            color: #00ffff;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 30px;
            animation: blink 1s infinite;
        }

        .EASTER-close {
            font-size: 1.3rem;
            color: #ffff00;
            border: 2px solid #ffff00;
            padding: 10px 30px;
            cursor: pointer;
            letter-spacing: 2px;
            background: transparent;
            font-family: 'VT323', monospace;
            transition: all 0.2s;
        }

        .EASTER-close:hover {
            background: rgba(255,255,0,0.2);
            box-shadow: 0 0 20px #ffff00;
        }

        /* Easter egg video screen */
        .easter-video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 3000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .easter-video-overlay.active {
            display: flex;
        }

        #easterVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .easter-close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            color: #ffff00;
            border: 2px solid #ffff00;
            background: rgba(0,0,0,0.7);
            padding: 6px 18px;
            cursor: pointer;
            letter-spacing: 2px;
            z-index: 3001;
            transition: all 0.2s;
            text-shadow: 0 0 8px #ffff00;
        }

        .easter-close-btn:hover {
            background: rgba(255,255,0,0.2);
            box-shadow: 0 0 20px #ffff00;
        }

        /* Social links panel overlaid on easter video */
        .easter-links {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            z-index: 3001;
            padding: 0 20px;
        }

        .easter-link-btn {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #000;
            background: #00ffff;
            border: 3px solid #fff;
            padding: 8px 20px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
            box-shadow: 0 0 12px rgba(0,255,255,0.5), 3px 3px 0 rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .easter-link-btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.07) translateY(-2px);
            box-shadow: 0 0 25px rgba(0,255,255,0.9), 3px 3px 0 rgba(0,0,0,0.8);
        }

        .easter-link-btn:active {
            transform: scale(0.97) translateY(0);
        }

        .easter-link-icon {
            font-size: 1.3rem;
            line-height: 1;
        }

        @keyframes rainbowText {
            0%   { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
            16%  { color: #ff8800; text-shadow: 0 0 10px #ff8800; }
            33%  { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
            50%  { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
            66%  { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
            83%  { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        }

        /* Screen shake */
        @keyframes screenShake {
            0%,100% { transform: translate(0,0); }
            10% { transform: translate(-5px, 4px); }
            20% { transform: translate(5px, -4px); }
            30% { transform: translate(-4px, 5px); }
            40% { transform: translate(4px, -5px); }
            50% { transform: translate(-6px, 3px); }
            60% { transform: translate(6px, -3px); }
            70% { transform: translate(-3px, 6px); }
            80% { transform: translate(3px, -6px); }
            90% { transform: translate(-5px, 4px); }
        }

        .crt-container.shake {
            animation: screenShake 0.5s ease;
        }

        /* ========================================== */
        /* RESPONSIVE STYLES FOR MOBILE */
        /* ========================================== */
        
        @media screen and (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }
            
            .crt-container {
                width: 95vw;
                height: auto;
                min-height: 90vh;
                border: 2px solid #00ff00;
                border-radius: 12px;
            }
            
            .crt-screen {
                overflow-y: auto;
            }
            
            .content {
                padding: 8px;
                height: auto;
                min-height: 90vh;
            }
            
            /* Mobile Header */
            .header {
                margin-bottom: 20px;
            }
            
            .header h1 {
                font-size: 2.2rem;
                letter-spacing: 3px;
                text-shadow: 
                    2px 2px 0 #00ffff,
                    -1px -1px 0 #ffff00,
                    0 0 15px #ff00ff;
            }
            
            .title-popup {
                font-size: 0.9rem;
                padding: 8px 15px;
                white-space: normal;
                max-width: 80vw;
                bottom: -50px;
            }
            
            .subtitle {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
            
            /* Stack layout vertically on mobile */
            .main-layout {
                flex-direction: column;
                gap: 15px;
                overflow: visible;
            }
            
            /* Mobile Spot Menu */
            .spot-menu {
                flex: none;
                width: 100%;
                max-height: 40vh;
                padding: 0;
                border: 2px solid;
            }

            .spot-menu-sticky { padding: 8px 8px 0 8px; }

            content: '';

            height: 8px;

            border-radius: 50%;

            animation: reelSpin 1.2s linear infinite;

        .reel-right.spinning {

        @keyframes reelSpin {

        .vhs-tape-track {

        /* muted state — all bars dimmed */
        .crt-volume-hud.muted .crt-vol-bar {
            background: #333;
            box-shadow: none;
        }

        .crt-vol-bar.peak {
            background: #ff4400;

        }

        /* ── MUTE BUTTON ACCENT ──────────────────────────────────────── */
        #muteBtn {

        // ── STATIC TOGGLE + LOCALSTORAGE ─────────────────────────────────────
        function applyToggleState(on) {
            staticToggle.checked = on;
            if (on) {
                toggleStatus.textContent = 'ON';
                toggleStatus.classList.remove('off');
            } else {
                toggleStatus.textContent = 'OFF';
                toggleStatus.classList.add('off');
            }
            try { localStorage.setItem('staticEnabled', on ? '1' : '0'); } catch(e) {}
        }

        // Load saved state (default ON)
        (function() {
            let saved = '1';
            try { saved = localStorage.getItem('staticEnabled') ?? '1'; } catch(e) {}
            applyToggleState(saved === '1');
        })();

        // Only the toggle switch itself toggles — not the whole bar
        document.getElementById('toggleSwitchWrap').addEventListener('click', function(e) {
            e.stopPropagation();
            applyToggleState(!staticToggle.checked);

        const staticAudio = new Audio('static.mp3');
        staticAudio.volume = 0.6;

        // ── CANVAS STATIC ────────────────────────────────────────────────────
        const ctx = staticCanvas.getContext('2d');

        function resizeCanvas() {
            const wrapper = staticCanvas.parentElement.parentElement;
            staticCanvas.width  = wrapper.clientWidth  || 640;
            staticCanvas.height = wrapper.clientHeight || 360;
        }

        // Only resize on actual window resize, not every frame
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas, { passive: true });

        function drawStatic(intensity) {
            const w = staticCanvas.width, h = staticCanvas.height;
            const imgData = ctx.createImageData(w, h);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                const v = Math.random() < intensity ? (Math.random() * 255 | 0) : 0;
                d[i]   = v;
                d[i+1] = v;
                d[i+2] = v;
                d[i+3] = Math.random() < intensity ? 220 : 0;
            }
            ctx.putImageData(imgData, 0, 0);

            // Occasional bright horizontal "sync" bands
            if (Math.random() < 0.25) {
                const y = Math.random() * h | 0;
                const bh = (Math.random() * 8 + 2) | 0;
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.4})`;
                ctx.fillRect(0, y, w, bh);
            }
        }

        function runStatic(duration, onDone) {
            cancelAnimationFrame(staticRafId);
            const start = performance.now();
            staticOverlay.classList.add('active');

            // Play audio if file is present
            staticAudio.currentTime = 0;
            staticAudio.play().catch(() => {}); // silently fail if file missing

            function frame(now) {
                const t = (now - start) / duration; // 0 → 1
                if (t >= 1) {
                    staticOverlay.classList.remove('active');
                    staticAudio.pause();
                    staticAudio.currentTime = 0;
                    onDone && onDone();
                    return;
                }
                const intensity = 0.85 * (1 - t * t);
                drawStatic(intensity);
                staticRafId = requestAnimationFrame(frame);
            }
            staticRafId = requestAnimationFrame(frame);
        }

        // ── CHANNEL DISPLAY ──────────────────────────────────────────────────
        let channelTimeout = null;
        function showChannel() {
            const ch = Math.floor(Math.random() * 99) + 1;
            channelDisplay.textContent = `CH ${String(ch).padStart(2, '0')}`;
            channelDisplay.classList.add('visible');
            clearTimeout(channelTimeout);
            channelTimeout = setTimeout(() => {
                channelDisplay.classList.remove('visible');
            }, 2200);
        }

        // ── TICKER ───────────────────────────────────────────────────────────
        function runTicker() {
            const tickerFooter = tickerEl.parentElement;
            const DEFAULT_COLOR = '#00ffff';
            const DEFAULT_GLOW  = '#00ffff';

            // Normalise every entry to { text, color, glow }
            const phrases = CONFIG.tickerPhrases.map(p =>
                typeof p === 'string'
                    ? { text: p, color: DEFAULT_COLOR, glow: DEFAULT_GLOW }
                    : { text: p.text, color: p.color || DEFAULT_COLOR, glow: p.glow || p.color || DEFAULT_GLOW }
            );

            let idx = 0;
            let skipping = false;

            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }
            shuffle(phrases);

            function applyPhrase(entry) {
                tickerEl.textContent = entry.text;
                tickerEl.style.color      = entry.color;
                tickerEl.style.textShadow = `0 0 8px ${entry.glow}, 0 0 16px ${entry.glow}44`;
            }

            function scrollPhrase() {
                skipping = false;
                const entry = phrases[idx % phrases.length];
                idx++;
                if (idx > 0 && idx % phrases.length === 0) shuffle(phrases);

                applyPhrase(entry);
                tickerEl.style.animation = 'none';
                tickerEl.offsetWidth; // reflow
                const pxPerSec = 90;
                const totalPx = window.innerWidth + tickerEl.scrollWidth + 80;
                const dur = totalPx / pxPerSec;
                tickerEl.style.animation = `tickerScroll ${dur}s linear`;
            }

            tickerEl.addEventListener('animationend', scrollPhrase);
            scrollPhrase();

            // Click ticker bar → jump to a new random phrase immediately
            tickerFooter.addEventListener('click', () => {
                if (skipping) return;
                skipping = true;

                // Pick a random phrase that isn't the current one
                let newIdx;
                do { newIdx = Math.floor(Math.random() * phrases.length); }
                while (phrases.length > 1 && newIdx === (idx - 1 + phrases.length) % phrases.length);
                idx = newIdx;

                // Brief border flash
                tickerFooter.classList.add('ticker-flash');
                setTimeout(() => tickerFooter.classList.remove('ticker-flash'), 300);

                // Restart with new phrase
                tickerEl.removeEventListener('animationend', scrollPhrase);
                scrollPhrase();
                tickerEl.addEventListener('animationend', scrollPhrase);
            });
        }

        // ── LOAD SPOT ────────────────────────────────────────────────────────
        function startVideo(src) {
            // Stop any current playback cleanly before switching source
            videoPlayer.pause();
            videoPlayer.removeAttribute('src');
            videoPlayer.load();

            videoPlayer.src = src;
            videoPlayer.load();

            const onReady = () => {
                videoPlayer.removeEventListener('canplay', onReady);
                videoPlayer.play().catch(() => {});
            };
            videoPlayer.addEventListener('canplay', onReady);
        }

        function loadSpot(index) {
            if (index < 0 || index >= CONFIG.spots.length) return;
            currentSpotIndex = index;

            const spot = CONFIG.spots[index];
            const items = cachedSpotItems;
            items.forEach((i, idx) => {
                i.classList.toggle('active', idx === index);
            });
            items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            showChannel();
            videoTitle.textContent = spot.name;

            if (staticToggle.checked) {
                runStatic(550, () => {
                    videoPlayer.style.display = 'block';
                    placeholder.style.display = 'none';
                    startVideo(spot.video);
                });
            } else {
                videoPlayer.style.display = 'block';
                placeholder.style.display = 'none';
                startVideo(spot.video);
            }
        }

        // ── EASTER CODE ─────────────────────────────────────────────────────
        const EASTERSequence = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let EASTERIndex = 0;

        EASTERClose.addEventListener('click', () => {
            EASTEROverlay.classList.remove('active');
            // Build social links from config (once)
            if (easterLinksEl.children.length === 0) {
                CONFIG.easterLinks.forEach(link => {
                    const a = document.createElement('a');
                    a.className = 'easter-link-btn';
                    a.href = link.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.innerHTML = `<span class="easter-link-icon">${link.icon}</span>${link.label}`;
                    easterLinksEl.appendChild(a);
                });
            }
            // Launch the easter egg video
            easterVideo.src = 'Clips/EASTER.mp4';
            easterVideoOverlay.classList.add('active');
            easterVideo.play().catch(() => {});
        });

        easterCloseBtn.addEventListener('click', () => {
            easterVideoOverlay.classList.remove('active');
            easterVideo.pause();
            easterVideo.src = '';
        });

        // ── INITIALIZE ───────────────────────────────────────────────────────
        function initializeApp() {
            const titleText = document.querySelector('.header h1').childNodes[0];
            titleText.textContent = `"${CONFIG.title}"`;
            document.querySelector('.subtitle').textContent = CONFIG.subtitle;

            if (CONFIG.twitchUrl) {
                mainTitle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.open(CONFIG.twitchUrl, '_blank');
                });
            }

            CONFIG.spots.forEach((spot, index) => {
                const spotItem = document.createElement('div');
                spotItem.className = 'spot-item';
                spotItem.setAttribute('data-video', spot.video);
                spotItem.setAttribute('data-description', spot.description || '');
                spotItem.setAttribute('data-location', spot.location || 'San Van');
                spotItem.textContent = spot.name;
                spotList.appendChild(spotItem);
                spotItem.addEventListener('click', function() {
                    loadSpot(index);
                });
            });
            // Cache the spot item NodeList once after all items are built
            cachedSpotItems = spotList.querySelectorAll('.spot-item');
            // Apply initial tab filter
            filterSpotsByLocation('San Van');
        }

        // ── LOCATION TAB FILTER ──────────────────────────────────────────────
        function filterSpotsByLocation(loc) {
            cachedSpotItems.forEach(item => {
                item.classList.toggle('loc-hidden', item.getAttribute('data-location') !== loc);
            });
            const visibleCount = Array.from(cachedSpotItems).filter(i => !i.classList.contains('loc-hidden')).length;
            document.getElementById('spotMenuHeader').textContent = `[ SELECT A SPOT ] [ 1-${visibleCount} ]`;
        }

        document.getElementById('locationTabs').addEventListener('click', function(e) {
            const tab = e.target.closest('.loc-tab');
            if (!tab) return;
            document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            filterSpotsByLocation(tab.getAttribute('data-loc'));
        });

        function pickRandom() {
            const r = Math.floor(Math.random() * CONFIG.spots.length);
            loadSpot(r);
            crtContainer.classList.remove('shake');
            void crtContainer.offsetWidth;
            crtContainer.classList.add('shake');
            setTimeout(() => crtContainer.classList.remove('shake'), 600);
        }

        // ── KEYBOARD CONTROLS ────────────────────────────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key === EASTERSequence[EASTERIndex]) {
                EASTERIndex++;
                if (EASTERIndex === EASTERSequence.length) {
                    EASTERIndex = 0;
                    crtContainer.classList.remove('shake');
                    void crtContainer.offsetWidth;
                    crtContainer.classList.add('shake');
                    setTimeout(() => {
                        EASTEROverlay.classList.add('active');
                        crtContainer.classList.remove('shake');
                    }, 500);
                }
            } else {
                EASTERIndex = 0;
            }
            if (e.key === 'r' || e.key === 'R') pickRandom();
        });

        // ── SPOT COUNT ───────────────────────────────────────────────────
        function updateSpotCount() {
            const total = CONFIG.spots.length;
            document.getElementById('spotMenuHeader').textContent = `[ SELECT A SPOT ] [ 1-${total} ]`;
        }

        // ── TIMECODE OVERLAY ─────────────────────────────────────────────
        const timecodeOverlay   = document.getElementById('timecodeOverlay');
        const timecodeCurrentEl = document.getElementById('timecodeCurrentTime');
        const timecodeDurEl     = document.getElementById('timecodeDuration');

        function fmtTime(s) {
            if (isNaN(s)) return '00:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }

        // ── CUSTOM VHS CONTROLS ──────────────────────────────────────────
        const playPauseBtn = document.getElementById('playPauseBtn');
        const rewBtn       = document.getElementById('rewBtn');
        const ffBtn        = document.getElementById('ffBtn');
        const vhsTapeTrack = document.getElementById('vhsTapeTrack');
        const vhsTapeFill  = document.getElementById('vhsTapeFill');
        const reelLeft     = document.getElementById('reelLeft');
        const reelRight    = document.getElementById('reelRight');

        videoPlayer.addEventListener('loadedmetadata', () => {
            timecodeDurEl.textContent = fmtTime(videoPlayer.duration);
            timecodeOverlay.classList.add('visible');
        });

        let timeupdatePending = false;
        videoPlayer.addEventListener('timeupdate', () => {
            if (timeupdatePending) return;
            timeupdatePending = true;
            requestAnimationFrame(() => {
                timeupdatePending = false;
                timecodeCurrentEl.textContent = fmtTime(videoPlayer.currentTime);
                // Update tape fill
                const pct = videoPlayer.duration ? (videoPlayer.currentTime / videoPlayer.duration) * 100 : 0;
                vhsTapeFill.style.width = pct + '%';
                // Reel spin speed based on progress
                const speed = Math.max(0.3, 2.5 - (pct / 100) * 2);
                reelLeft.style.animationDuration  = speed + 's';
                reelRight.style.animationDuration = speed + 's';
            });
        });

        videoPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '❙❙ PAUSE';
            reelLeft.classList.add('spinning');
            reelRight.classList.add('spinning');
        });

        videoPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '► PLAY';
            reelLeft.classList.remove('spinning');
            reelRight.classList.remove('spinning');
        });

        videoPlayer.addEventListener('ended', () => {
            videoPlayer.currentTime = 0;
            videoPlayer.play().catch(() => {});
        });

        playPauseBtn.addEventListener('click', () => {
            if (!videoPlayer.src || videoPlayer.style.display === 'none') return;
            videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
        });

        rewBtn.addEventListener('click', () => {
            if (!videoPlayer.src || videoPlayer.style.display === 'none') return;
            videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 3);
        });

        ffBtn.addEventListener('click', () => {
            if (!videoPlayer.src || videoPlayer.style.display === 'none') return;
            videoPlayer.currentTime = Math.min(videoPlayer.duration || 0, videoPlayer.currentTime + 3);
        });

        // Click-to-seek on tape track
        vhsTapeTrack.addEventListener('click', (e) => {
            if (!videoPlayer.duration) return;
            const rect = vhsTapeTrack.getBoundingClientRect();
            const pct  = (e.clientX - rect.left) / rect.width;
            videoPlayer.currentTime = pct * videoPlayer.duration;
        });

        // ── CRT VOLUME HUD ───────────────────────────────────────────────
        const crtVolumeHud = document.getElementById('crtVolumeHud');
        const crtVolBars   = document.getElementById('crtVolBars');
        const crtVolLabel  = document.getElementById('crtVolLabel');
        const muteBtn      = document.getElementById('muteBtn');
        const volDownBtn   = document.getElementById('volDownBtn');
        const volUpBtn     = document.getElementById('volUpBtn');
        const videoWrapper = document.querySelector('.video-wrapper');

        const VOL_STEPS = 20;   // number of bar segments
        const VOL_PEAK  = 16;   // bars at/above this index turn red
        let volHudTimeout = null;

        // Build bar segments
        let cachedVolBars = [];
        for (let i = 0; i < VOL_STEPS; i++) {
            const bar = document.createElement('div');
            bar.className = 'crt-vol-bar';
            // Height scales from short (left) to tall (right)
            const h = 4 + Math.round((i / (VOL_STEPS - 1)) * 24);
            bar.style.height = h + 'px';
            crtVolBars.appendChild(bar);
            cachedVolBars.push(bar);
        }

        function updateVolHud() {
            const vol = videoPlayer.volume;   // 0–1
            const muted = videoPlayer.muted;
            const filled = muted ? 0 : Math.round(vol * VOL_STEPS);
            cachedVolBars.forEach((bar, i) => {
                const active = i < filled;
                bar.style.background = active
                    ? (i >= VOL_PEAK ? '#ff4400' : '#00ff00')
                    : '#1a1a1a';
                bar.style.boxShadow = active
                    ? (i >= VOL_PEAK ? '0 0 8px #ff4400' : '0 0 6px #00ff00')
                    : 'none';
            });
            crtVolLabel.textContent = muted ? '🔇 MUTE' : `VOL ${filled}`;
            crtVolumeHud.classList.toggle('muted', muted);
        }

        function showVolHud() {
            updateVolHud();
            crtVolumeHud.classList.add('visible');
            clearTimeout(volHudTimeout);
            volHudTimeout = setTimeout(() => crtVolumeHud.classList.remove('visible'), 2000);
        }

        // Volume +/-
        volUpBtn.addEventListener('click', () => {
            videoPlayer.volume = Math.min(1, Math.round((videoPlayer.volume + 0.05) * 100) / 100);
            if (videoPlayer.muted) { videoPlayer.muted = false; muteBtn.textContent = '🔊  MUTE '; }
            showVolHud();
        });

        volDownBtn.addEventListener('click', () => {
            videoPlayer.volume = Math.max(0, Math.round((videoPlayer.volume - 0.05) * 100) / 100);
            showVolHud();
        });

        // Mute / Unmute
        muteBtn.addEventListener('click', () => {
            videoPlayer.muted = !videoPlayer.muted;
            muteBtn.textContent = videoPlayer.muted ? '🔇 UNMUTE' : '🔊  MUTE ';
            showVolHud();
        });

        // Init mute button state & volume
        videoPlayer.volume = 1;
        videoPlayer.muted  = false;
        updateVolHud();

        // ── FULLSCREEN — double-click video wrapper ───────────────────────
        videoWrapper.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                const fn = videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen || videoWrapper.mozRequestFullScreen;
                if (fn) fn.call(videoWrapper);
            } else {
                const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
                if (fn) fn.call(document);
            }
        });

        // ── BOOT: fetch config.json, then start everything ────────────────
        fetch('config.json')
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(data => {
                CONFIG = data;
                initializeApp();
                updateSpotCount();
                runTicker();
            })
            .catch(err => {
                console.error('Failed to load config.json:', err);
                spotList.innerHTML = '<div style="color:#ff0000;padding:12px;font-size:1.2rem;letter-spacing:2px;">⚠ config.json NOT FOUND</div>';
            });

        // Handle video errors
        videoPlayer.addEventListener('error', function() {
            placeholder.style.display = 'block';
            videoPlayer.style.display = 'none';
            staticOverlay.classList.remove('active');
            timecodeOverlay.classList.remove('visible');
            reelLeft.classList.remove('spinning');
            reelRight.classList.remove('spinning');
            vhsTapeFill.style.width = '0%';
            // Put error label inside smpte label
            const lbl = placeholder.querySelector('.smpte-label');
            if (lbl) lbl.innerHTML = '⚠ VIDEO FILE NOT FOUND ⚠<br><span style="font-size:1rem">[ CHECK FILE PATH ]</span>';
        });
    </script>
</body>
</html>
